name: PR checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Lightweight tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.3"

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in benchmark/*.sh tests/*.sh; do
            echo "== bash -n $f"
            bash -n "$f"
          done

      - name: Validate benchmark definitions
        run: python benchmark/validate_definitions.py

      - name: Run Python test suites
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            benchmark/test_openswath_metrics.py \
            benchmark/test_prose_metrics.py \
            benchmark/test_proteobench_compare.py \
            benchmark/report/test_generic_renderer.py \
            benchmark/report/test_v2_schema.py; do
            echo "== python $f"
            python "$f"
          done

      - name: Run shell contract tests
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test_id_validation.sh
          bash tests/test_dispatch_step.sh
