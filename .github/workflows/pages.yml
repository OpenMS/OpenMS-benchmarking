name: Pages

# Static benchmark-results site (ProteoBench external-context comparison +
# benchmark report).
#
# Two views:
#   pinned.html  - the DEFAULT/reference view, generated from the vendored
#                  snapshot in benchmark/results/proteobench/external/
#                  (reproducible from the checkout alone, no network).
#   latest.html  - the OPTIONAL latest view, generated from a fresh shallow
#                  clone of the upstream results repository at its HEAD.
#                  Clearly labeled "not the reference" on the page itself.
#
# Storage split (see README "Results storage"):
#   * main              - workflow/report code, the pinned ProteoBench
#                         snapshot, and the local tool-reference JSONs.
#   * benchmark-results - only generated OpenMS benchmark run JSONs.
# The report renderer takes a single --results-dir, so this workflow copies
# the generated run families from the data branch plus main's tools/ into
# `site-results/` before rendering. It deliberately never copies main's
# benchmark/results/openms or openswath_dia trees: they are frozen history
# from before the split, and merging them would double-count runs.
#
# Deployment uses the official Actions/Deploy pattern with an artifact
# (not a gh-pages branch) so no force-pushes or extra branches are needed.
# Runs on manual dispatch or pushes to main; the Pages site itself must be
# enabled once in repository settings (Source: GitHub Actions).

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code and pinned reference data (main)
        uses: actions/checkout@v6
        with:
          ref: main

      # Separate checkout: generated results live on an unprotected data
      # branch. continue-on-error turns a missing/renamed branch into the
      # explicit failure message below instead of an opaque checkout error.
      - name: Checkout generated results (benchmark-results)
        id: data
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          ref: benchmark-results
          path: benchmark-data
          fetch-depth: 1

      - name: Verify benchmark-results checkout
        if: steps.data.outcome != 'success'
        run: |
          echo "::error::could not check out branch 'benchmark-results'. Generated benchmark results live there; if the branch was renamed or deleted, restore it (see README 'Results and reporting') before publishing the site."
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # The upstream results repository is a flat set of submission JSONs;
      # a shallow clone of HEAD is all the latest view needs. If upstream is
      # temporarily unreachable the pinned view is still published.
      - name: Shallow-clone upstream for the latest view
        continue-on-error: true
        run: |
          git clone --depth 1 --quiet \
            https://github.com/Proteobench/Results_quant_ion_DDA upstream

      # One results tree for the renderer: generated runs from the data
      # branch, tool-reference JSONs from main. Nothing else is copied.
      - name: Assemble combined results tree
        env:
          DATA_DIR: benchmark-data
          OUT_DIR: site-results
        run: |
          set -euo pipefail
          DATA_DIR="${DATA_DIR:-benchmark-data}"
          OUT_DIR="${OUT_DIR:-site-results}"

          for d in openms openswath_dia/openms; do
            if [ ! -d "$DATA_DIR/$d" ]; then
              echo "::error::$DATA_DIR/$d is missing: branch 'benchmark-results' must contain generated results at $d/"
              exit 1
            fi
          done
          if [ ! -d "benchmark/results/tools" ]; then
            echo "::error::benchmark/results/tools is missing; the local tool-reference JSONs must stay on main"
            exit 1
          fi

          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR/openms" "$OUT_DIR/openswath_dia/openms" "$OUT_DIR/tools"
          cp -a "$DATA_DIR/openms/." "$OUT_DIR/openms/"
          cp -a "$DATA_DIR/openswath_dia/openms/." "$OUT_DIR/openswath_dia/openms/"
          cp -a benchmark/results/tools/. "$OUT_DIR/tools/"

          smoke="$(find "$OUT_DIR/openms" -maxdepth 1 -name 'smoke-*.json' | wc -l)"
          openswath="$(find "$OUT_DIR/openswath_dia/openms" -maxdepth 1 -name 'openswath_dia-*.json' | wc -l)"
          if [ "$smoke" -eq 0 ] || [ "$openswath" -eq 0 ]; then
            echo "::error::branch 'benchmark-results' holds no usable history (smoke=$smoke, openswath=$openswath); refusing to publish an empty report"
            exit 1
          fi
          echo "assembled $smoke smoke run(s), $openswath openswath run(s), $(find "$OUT_DIR/tools" -name '*.json' | wc -l) tool reference(s)"

      - name: Generate site (pinned reference view + optional latest view)
        run: |
          ARGS=(--site-dir site)
          if [ -d upstream ]; then
            ARGS+=(--latest-from upstream)
          else
            echo "::warning::upstream clone unavailable; publishing pinned reference view only"
          fi
          python benchmark/pages_generate.py "${ARGS[@]}"
          # Benchmark report from the generated run history (data branch) plus
          # main's tool-reference JSONs. Same renderer the CI report uses.
          python benchmark/report/report_generate.py render \
            --results-dir site-results --out site/report.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
