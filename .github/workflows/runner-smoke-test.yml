name: Runner smoke test

# First-stage validation of the self-hosted benchmark runner (issue #24).
#
# Confirmed runtime (issue #24):
#   * The GitHub Actions runner application stays on the host. Only the job's
#     steps execute inside a Docker container, via the job-level `container:`
#     key below. The runner itself is never containerized by this workflow.
#   * The runner's Docker is rootless and supports job-level containers; both
#     are maintainer-confirmed. This workflow does not itself prove either - the
#     first live dispatch is what exercises that path.
#   * The base image is the official, generic Ubuntu LTS image (ubuntu:24.04).
#     No custom OpenMS GHCR image is built, published or required. The tag is
#     mutable: no approved digest is recorded yet, so upstream can repoint it
#     and two dispatches need not run identical bits. Pin it by digest
#     (ubuntu@sha256:<digest>) once an approved digest exists.
#   * The generic image does not ship the benchmark toolchain, so the minimum
#     set the probe checks (git, python3, CMake, Ninja, g++, GNU time) is
#     installed inside the ephemeral job container by the first step. Nothing
#     is installed on the host.
#   * This is the workflow's only job. The runner accepts container-based jobs
#     only (owner-confirmed), so nothing here runs directly on the host and
#     there is no host-level probe to compare against.
#   * Host egress restrictions and proxy/firewall handling are being set up
#     separately by the maintainers and are out of scope here.
#
# Trust model and safety properties:
#   * Manual dispatch only. workflow_dispatch requires write access to the
#     repository, so untrusted fork code can never trigger this workflow.
#     There is deliberately no pull_request / push / schedule trigger.
#   * No actions/checkout: the smoke test must not execute repository-controlled
#     scripts, build hooks or checked-out content on the self-hosted machine.
#   * Probe-only job: the only write is the container-local tool install
#     described above (apt inside the ephemeral job container). No host or
#     runner configuration changes, no secrets referenced, no artifacts
#     uploaded. Findings are printed to the job log only.
#   * The container gets no `options:`, no `volumes:` and no credentials: this
#     workflow configures no additional host mounts, no Docker socket
#     (/var/run/docker.sock), no --privileged mode and no host namespace access.
#     GitHub Actions itself may still provide runner-managed mounts for the job
#     workspace and temporary directory; those are not configured here.
#
# This repository is public, so the job log is public too. Output is therefore
# limited to non-identifying environment facts: no host name, no user or
# directory layout, no device names, no container ID, no environment dump, no
# credentials.
#
# Scope: this job validates *only* that the job container can run and that the
# basic toolchain is present inside it. It deliberately does NOT validate:
#   * outbound network access (github.com, raw.githubusercontent.com,
#     archive.openms.de) needed by the build and package paths;
#   * vcpkg/CMake configuration or an OpenMS source build;
#   * realistic disk headroom for a full build plus artifacts;
#   * benchmark execution or result correctness (smoke/OpenSwath stages);
#   * the rootless Docker setup on the actual runner, cgroup driver behaviour,
#     or image provenance (the base image is tag-pinned, not digest-pinned).
# Those are separate, later validation stages.

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # Containerized smoke test. The job container is created by the runner on the
  # host; its steps are executed inside that container.
  container-smoke:
    name: Containerized smoke test
    # Explicit selector: the owner confirmed this runner carries the `benchmark`
    # label and accepts container-based jobs only, so the job-level container
    # below is how the job executes.
    runs-on: [self-hosted, benchmark]
    timeout-minutes: 15

    # Job-level container: supported by this runner's rootless Docker
    # (maintainer-confirmed, issue #24). The image is the official generic
    # Ubuntu LTS base; the toolchain the probe requires is installed by the
    # first step inside this container.
    #
    # The tag is mutable: upstream rebuilds repoint ubuntu:24.04, so two
    # dispatches need not run identical bits. Replace it with an approved digest
    # (ubuntu@sha256:<digest>) as soon as one is recorded.
    #
    # Intentionally absent on purpose:
    #   options:   (no --privileged, no --network host, no extra capabilities)
    #   volumes:   (no /var/run/docker.sock, no host paths)
    #   credentials: (no registry secrets are referenced)
    container:
      image: ubuntu:24.04

    steps:
      # The generic Ubuntu LTS image ships bash, coreutils and apt only: none of
      # the benchmark toolchain is preinstalled. This installs exactly what the
      # probe below requires (git, python3, CMake, Ninja, the C++ compiler and
      # GNU time) inside the ephemeral job container. GitHub runs job containers
      # as root, so no privilege escalation helper is involved.
      - name: Install probe toolchain (container-local)
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            git \
            python3 \
            cmake \
            ninja-build \
            g++ \
            time
          rm -rf /var/lib/apt/lists/*

      # Minimum requirements, all checked below: Linux, bash, git, python3,
      # CMake, Ninja, a usable C++ compiler, GNU coreutils (`stat -f`, `nproc`)
      # and GNU /usr/bin/time with -v support. They are installed by the
      # preceding step; this step only reports what it finds.
      - name: Container identity
        run: |
          set -uo pipefail

          echo "RUNNER_OS:          ${RUNNER_OS:-<unset>}"
          echo "RUNNER_ARCH:        ${RUNNER_ARCH:-<unset>}"
          echo "RUNNER_ENVIRONMENT: ${RUNNER_ENVIRONMENT:-<unset>}"
          echo "run_id:             ${GITHUB_RUN_ID:-<unset>}"
          echo "trigger_ref:        ${GITHUB_REF:-<unset>}"
          echo "workflow:           ${GITHUB_WORKFLOW:-<unset>}"

          # Heuristic only: Docker creates /.dockerenv, but its presence or
          # absence is not definitive proof of container isolation (other
          # runtimes may not create it, and a container can lack it). Reported as
          # an observation, never as a guarantee.
          if [ -e /.dockerenv ]; then
            echo "job_runtime:        /.dockerenv present (container heuristic)"
          else
            echo "job_runtime:        /.dockerenv absent (heuristic inconclusive)"
          fi

          # Deliberately not printed: RUNNER_NAME (usually the host name), the
          # host name, the container ID, the full environment, and any
          # token/credential variable.

      - name: Operating system (container view)
        run: |
          set -uo pipefail

          # -srm omits the node name so the host name is not disclosed. Inside a
          # container this is the kernel shared with the host.
          echo "uname -srm: $(uname -srm 2>&1)"
          echo "machine:    $(uname -m 2>&1)"

          # This is the image's own release file, not the host distribution.
          if [ -r /etc/os-release ]; then
            echo "image distribution (/etc/os-release):"
            while IFS='=' read -r key value; do
              case "$key" in
                PRETTY_NAME|NAME|ID|ID_LIKE|VERSION_ID|VERSION_CODENAME)
                  echo "  ${key}=${value//\"/}"
                  ;;
              esac
            done < /etc/os-release
          else
            echo "image distribution: /etc/os-release not readable"
          fi

      - name: Container-visible resources
        run: |
          set -uo pipefail

          echo "scope: every figure below describes what THIS CONTAINER can see."
          echo "       Container-visible CPU and memory are NOT a measurement of the"
          echo "       host. They do not show that the host has any particular core"
          echo "       count or RAM size."

          # nproc counts the processing units visible to this process (its CPU
          # affinity mask, further bounded by OMP_NUM_THREADS /
          # OMP_THREAD_LIMIT when set). It is not a statement about the host's
          # installed processors, and whether it reflects a CFS CPU quota is
          # runtime-dependent, so a low value cannot be attributed to a specific
          # cause. There is no getconf fallback: if nproc is unavailable the
          # count is reported as unknown rather than substituted.
          if command -v nproc >/dev/null 2>&1; then
            echo "cpu_visible: $(nproc)"
          else
            echo "cpu_visible: unknown (nproc unavailable)"
          fi

          if [ -r /proc/cpuinfo ]; then
            model="$(grep -m1 -E '^(model name|Hardware|Processor)[[:space:]]*:' /proc/cpuinfo | sed 's/^[^:]*:[[:space:]]*//; s/[[:space:]]*$//')"
            echo "cpu_model: ${model:-not reported by /proc/cpuinfo}"
          else
            echo "cpu_model: /proc/cpuinfo not readable"
          fi

          # /proc/meminfo is normally the host's memory unless the container is
          # limited. The cgroup value below is the limit reported from inside
          # this container, not an authoritative statement of what it may use.
          if [ -r /proc/meminfo ]; then
            mem_total="$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)"
            mem_avail="$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)"
            mem_free="$(awk '/^MemFree:/ {print $2}' /proc/meminfo)"
            echo "mem_visible_total_kb:     ${mem_total:-?}"
            echo "mem_visible_available_kb: ${mem_avail:-${mem_free:-?}}"
            if [ -n "${mem_total:-}" ]; then
              echo "mem_visible_total_gib: $(awk -v kb="$mem_total" 'BEGIN {printf "%.1f", kb / 1048576}')"
            fi
          else
            echo "mem_visible: /proc/meminfo not readable"
          fi

          # Effective memory limit imposed by the cgroup hierarchy, if any.
          # cgroup v2: /sys/fs/cgroup/memory.max ("max" = no limit set).
          # cgroup v1: .../memory.limit_in_bytes (a huge page-aligned sentinel
          # around 9223372036854771712 = no limit set).
          # Nested or unusual cgroup layouts can hide the effective limit, so a
          # numeric value here is the best available signal, not proof of what
          # this job can actually allocate.
          mem_cgroup_limit_bytes=""
          mem_cgroup_note="unknown - no usable cgroup memory limit"
          for limit_file in /sys/fs/cgroup/memory.max \
                            /sys/fs/cgroup/memory/memory.limit_in_bytes; do
            [ -r "$limit_file" ] || continue
            raw_limit="$(head -n 1 "$limit_file" 2>/dev/null | tr -d '[:space:]')"
            case "$raw_limit" in
              max) mem_cgroup_note="none reported - memory.max is 'max'"; break ;;
              ''|*[!0-9]*) continue ;;
            esac
            # 19+ digits is the v1 unlimited sentinel, not a real byte limit.
            if [ "${#raw_limit}" -gt 18 ]; then
              mem_cgroup_note="none reported - v1 unlimited sentinel"
              break
            fi
            if [ "$raw_limit" -eq 0 ]; then continue; fi
            mem_cgroup_limit_bytes="$raw_limit"
            break
          done
          if [ -n "$mem_cgroup_limit_bytes" ]; then
            echo "mem_cgroup_limit_bytes: $mem_cgroup_limit_bytes"
            echo "mem_cgroup_limit_gib:   $(awk -v b="$mem_cgroup_limit_bytes" 'BEGIN {printf "%.1f", b / 1073741824}')"
          else
            echo "mem_cgroup_limit: $mem_cgroup_note"
          fi

          # Sizes only: device names and mount paths are internal details that
          # do not belong in a public job log. stat -f is used instead of df,
          # whose columns shift when a device name contains spaces.
          disk_row() {
            label="$1"
            target="$2"
            line="$(stat -f -c '%S %b %a' "$target" 2>/dev/null | awk -v label="$label" \
              'NF == 3 { printf "  %-9s total=%.1f GiB available=%.1f GiB used=%.0f%%\n", label, $1 * $2 / 1073741824, $1 * $3 / 1073741824, ($2 > 0 ? 100 - 100 * $3 / $2 : 0) }')"
            echo "${line:-  ${label}: disk info unavailable}"
          }
          echo "disk visible to the container (GiB):"
          disk_row root /
          disk_row workspace "${GITHUB_WORKSPACE:-.}"
          disk_row temp "${RUNNER_TEMP:-/tmp}"

      - name: Required tools (container)
        run: |
          set -uo pipefail
          fail=0

          ok()     { printf 'OK       required: %-14s %s\n' "$1" "$2"; }
          bad()    { printf 'MISSING  required: %-14s %s\n' "$1" "$2"; fail=1; }
          broken() { printf 'BROKEN   required: %-14s %s\n' "$1" "$2"; fail=1; }

          # A required tool counts as usable only if it exists AND its version
          # command succeeds with output: a broken shim or wrapper would
          # otherwise be reported as merely present.
          check_tool() {
            tool="$1"
            if ! command -v "$tool" >/dev/null 2>&1; then
              bad "$tool" "not found on PATH in the container image"
              return
            fi
            tool_out="$("$tool" --version 2>&1)"
            tool_rc=$?
            tool_first="${tool_out%%$'\n'*}"
            if [ "$tool_rc" -eq 0 ] && [ -n "$tool_first" ]; then
              ok "$tool" "$tool_first"
            else
              broken "$tool" "found on PATH but --version exited $tool_rc: ${tool_first:-<no output>}"
            fi
          }

          if [ "$(uname -s 2>/dev/null)" = "Linux" ]; then
            ok "platform" "Linux"
          else
            bad "platform" "$(uname -s 2>/dev/null || echo unknown) - all benchmark workflows require Linux"
          fi

          check_tool bash
          check_tool git
          check_tool python3
          check_tool cmake
          check_tool ninja

          compiler=""
          compiler_version=""
          compiler_problem=""
          for candidate in g++ clang++ c++; do
            command -v "$candidate" >/dev/null 2>&1 || continue
            candidate_out="$("$candidate" --version 2>&1)"
            candidate_rc=$?
            candidate_first="${candidate_out%%$'\n'*}"
            if [ "$candidate_rc" -eq 0 ] && [ -n "$candidate_first" ]; then
              compiler="$candidate"
              compiler_version="$candidate_first"
              break
            fi
            compiler_problem="$candidate: --version exited $candidate_rc"
          done
          if [ -n "$compiler" ]; then
            ok "C++ compiler" "$compiler: $compiler_version"
          elif [ -n "$compiler_problem" ]; then
            broken "C++ compiler" "found on PATH but not usable ($compiler_problem)"
          else
            bad "C++ compiler" "none of g++, clang++ or c++ found on PATH in the container image"
          fi

          # The benchmark runners use `/usr/bin/time -v`; a BSD time binary
          # accepts no -v and would silently degrade CPU/RSS metrics.
          if [ ! -e /usr/bin/time ]; then
            bad "GNU time" "/usr/bin/time absent (benchmark peak-RSS/CPU metrics degrade)"
          elif /usr/bin/time --version 2>&1 | head -n 1 | grep -qi 'GNU time'; then
            ok "GNU time" "$(/usr/bin/time --version 2>&1 | head -n 1)"
          else
            bad "GNU time" "/usr/bin/time present but not GNU time (no -v support)"
          fi

          echo
          if [ "$fail" -ne 0 ]; then
            echo "::error::Required prerequisites are missing or unusable in the container image (see MISSING/BROKEN lines above)."
            exit 1
          fi
          echo "All required prerequisites are present and working inside the container."

      - name: Optional tools (container, non-blocking)
        if: always()
        run: |
          set -uo pipefail

          note() { printf '%-8s optional: %-8s %s\n' "$1" "$2" "$3"; }
          have() { command -v "$1" >/dev/null 2>&1; }

          if have ccache; then
            note PRESENT ccache "$(ccache --version 2>&1 | head -n 1)"
          else
            note ABSENT ccache "not installed in the container image - builds would run cold"
          fi

          # Privilege escalation is not exercised: this only reports whether
          # sudo is installed in the image. `sudo` is never invoked, so the
          # probe cannot be misread as evidence that it works.
          if have sudo; then
            note PRESENT sudo "installed inside the container (presence only; not exercised)"
          else
            note ABSENT sudo "not installed in the container image"
          fi

          echo
          echo "Optional tools never fail this job."

      - name: Interpretation
        if: always()
        run: |
          set -uo pipefail

          cat <<'NOTE'
          What this run does and does not establish:
            * It shows whether the job-level container started and which tools the
              image provides. It validates the image contents, not the host.
            * CPU, memory and disk figures above are what the container can see.
              They are not evidence that the host has any particular core count
              or RAM size.
            * The runner's Docker is rootless and supports job-level containers
              (maintainer-confirmed, issue #24); this probe does not re-verify
              that, so the first live dispatch is the real check of that path.
            * The base image is the mutable ubuntu:24.04 tag, not a pinned
              digest, so a later dispatch may run different image contents.
            * The runner accepts container-based jobs only, so these steps always
              run inside the image above; nothing in this workflow runs on the
              host.
            * Outbound network access, proxy/firewall rules and the OpenMS build
              toolchain are out of scope for the smoke test.
          NOTE
