name: "Nightly Benchmark (routine package mode)"

# Routine benchmarking loop (Issue #8788 follow-up): turn the already-proven
# package-mode pipeline of benchmark.yml into a scheduled benchmark.
#
# Flow (all on this repository):
#   schedule / workflow_dispatch
#     -> dispatch benchmark.yml on main with runtime_source=package
#     -> wait for that run to finish (fail here if it failed)
#     -> download only its benchmark result artifacts (tiny JSONs)
#     -> extract the normalized result JSONs (fail loudly if missing)
#     -> commit them to benchmark/results/ and push to main
#     -> dispatch pages.yml explicitly: a GITHUB_TOKEN push does not fire
#        pages.yml's push trigger (GitHub never triggers push events for
#        GITHUB_TOKEN pushes), so the report would otherwise go stale
#
# Why dispatch instead of adding a schedule to benchmark.yml itself:
# benchmark.yml is dispatch-only today, its inputs have defaults tuned for
# source mode, and scheduled runs receive empty inputs. Dispatching it with
# explicit inputs reuses the proven pipeline verbatim and leaves every
# existing behavior (manual dispatch included) untouched.
#
# Permissions (minimum required):
#   actions: write   - dispatch benchmark.yml + download its run artifacts
#   contents: write  - commit result JSONs and push to main
# Nothing else. The dispatched run itself keeps benchmark.yml's permissions.

on:
  schedule:
    # Daily at 03:15 UTC. Package mode resolves the newest published Debian
    # nightly .deb at dispatch time, so the exact hour is not load-bearing.
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-benchmark
  cancel-in-progress: false

jobs:
  persist-nightly-package-results:
    name: "Dispatch package benchmark, persist results"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout benchmarking repo
        uses: actions/checkout@v6
        with:
          # Cheap; also keeps the rebase-before-push below safe even if a
          # commit lands on main while the benchmark is running.
          fetch-depth: 0

      - name: Dispatch benchmark.yml (package mode) and wait for it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Dispatch the proven package-mode pipeline and ask the dispatch API
          # for the created run's id directly (return_run_details=true, the
          # approach suggested in OpenMS/OpenMS-benchmarking#7; announced
          # 2026-02-19, GHES/ignored-flag servers may still answer 204 with an
          # empty body, which fails the empty check below). The returned
          # workflow_run_id is the ONLY identifier trusted downstream - there
          # is deliberately no commit-SHA/time-window/recency discovery
          # fallback. If the call fails or yields no usable id, the job fails
          # here, before any waiting, artifact download, or persistence.
          if ! BENCH_RUN_ID="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/benchmark.yml/dispatches" \
            -f ref=main \
            -F "inputs[runtime_source]=package" \
            -F return_run_details=true \
            --jq '.workflow_run_id // empty')"; then
            echo "::error::workflow dispatch API call failed - cannot determine which run was created"
            exit 1
          fi

          # Strict id validation: reject empty (missing/204/null), non-numeric,
          # malformed, zero, or negative values before touching the run.
          if [ -z "$BENCH_RUN_ID" ]; then
            echo "::error::dispatch returned no workflow_run_id (empty or null response)"
            exit 1
          fi
          # Match the WHOLE captured value with bash's own regex, not grep:
          # grep is line-oriented and would accept an embedded-newline value
          # as long as one line is all digits, letting malformed input reach
          # GITHUB_ENV (and an [ -eq ] that errors are silently swallowed
          # inside if conditions).
          if [[ ! "$BENCH_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::dispatch returned a non-numeric or malformed workflow_run_id: '$BENCH_RUN_ID'"
            exit 1
          fi
          # Bound the length before integer comparison: 18 digits stays well
          # inside int64 so the zero check below cannot overflow into an
          # "integer expression expected" error that set -e would miss inside if.
          if [ "${#BENCH_RUN_ID}" -gt 18 ]; then
            echo "::error::dispatch returned an implausibly large workflow_run_id: '$BENCH_RUN_ID'"
            exit 1
          fi
          if [ "$BENCH_RUN_ID" -eq 0 ]; then
            echo "::error::dispatch returned workflow_run_id 0 (invalid)"
            exit 1
          fi

          echo "Dispatched Benchmark (package mode) on main; captured workflow_run_id=$BENCH_RUN_ID"
          echo "BENCH_RUN_ID=$BENCH_RUN_ID" >> "$GITHUB_ENV"

          for _ in $(seq 1 90); do
            read -r STATUS CONCLUSION <<<"$(gh run view "$BENCH_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --json status,conclusion \
              --jq '.status + " " + (.conclusion // "")')"
            [ "$STATUS" = "completed" ] && break
            sleep 30
          done
          if [ "$STATUS" != "completed" ]; then
            echo "::error::timed out waiting for benchmark run $BENCH_RUN_ID"
            exit 1
          fi
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::dispatched benchmark run $BENCH_RUN_ID finished with conclusion '$CONCLUSION'"
            exit 1
          fi

      - name: Download benchmark result artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p downloaded
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BENCH_RUN_ID/artifacts" --paginate \
            --jq '.artifacts[] | select(.name | test("^benchmark-(results|openswath)-")) | .id' \
            > artifact-ids.txt
          if [ ! -s artifact-ids.txt ]; then
            echo "::error::benchmark run $BENCH_RUN_ID produced no benchmark-results-*/benchmark-openswath-* artifacts"
            exit 1
          fi
          while read -r artifact_id; do
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "artifact-$artifact_id.zip"
            unzip -o -q "artifact-$artifact_id.zip" -d downloaded
          done < artifact-ids.txt

      # Persist exactly the two normalized result JSONs, renamed to this
      # dispatch's run ID (the report keys runs by run_id, so the name must
      # match the ID inside the file), into the locations the committed
      # results already use. Everything else in the artifacts (raw JSONs,
      # resource logs, tools/) stays out of the repository.
      - name: Extract result JSONs
        run: |
          set -euo pipefail
          smoke="$(find downloaded -name 'smoke-*.json' ! -path '*/tools/*' ! -path '*/reference/*' -print -quit)"
          if [ -z "$smoke" ]; then
            echo "::error::no smoke-*.json result in the benchmark artifacts"
            exit 1
          fi
          openswath="$(find downloaded -name 'openswath_dia-*.json' ! -path '*/tools/*' ! -path '*/reference/*' -print -quit)"
          if [ -z "$openswath" ]; then
            echo "::error::no openswath_dia-*.json result in the benchmark artifacts"
            exit 1
          fi
          # Verify BOTH results before persisting anything: package-mode
          # runtime identity plus run_id match. Nothing reaches the results
          # tree until both checks pass, so a failed guard cannot leave
          # anything behind for the commit step to pick up.
          python3 - "$smoke" "$openswath" "$BENCH_RUN_ID" <<'PY'
          import json, sys
          smoke_path, openswath_path, expected = sys.argv[1], sys.argv[2], sys.argv[3]
          for label, path in (("smoke", smoke_path), ("openswath", openswath_path)):
              with open(path, encoding="utf-8") as fh:
                  data = json.load(fh)
              # Race guard: only persist what this workflow dispatched. A
              # benchmark run adopted by mistake (e.g. a concurrent manual
              # source-mode dispatch on main) carries a different runtime
              # identity and must fail here.
              runtime_source = data.get("identity", {}).get("runtime", {}).get("runtime_source")
              if runtime_source != "package":
                  sys.exit(f"{label}: identity.runtime.runtime_source is {runtime_source!r}, "
                           f"expected 'package' - refusing to persist a non-package run")
              # v2 schema keeps run_id under run.run_id; tolerate the legacy
              # top-level key so a future schema change fails here loudly.
              run_id = data.get("run", {}).get("run_id") or data.get("run_id")
              if str(run_id) != expected:
                  sys.exit(f"{label}: run_id mismatch (file says {run_id!r}, expected {expected})")
          print("result JSONs valid; package runtime and run_id verified")
          PY
          mkdir -p benchmark/results/openms benchmark/results/openswath_dia/openms
          cp "$smoke" "benchmark/results/openms/smoke-$BENCH_RUN_ID.json"
          cp "$openswath" "benchmark/results/openswath_dia/openms/openswath_dia-$BENCH_RUN_ID.json"

      - name: Commit results to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmark/results
          if git diff --cached --quiet; then
            echo "::error::nothing new to persist for benchmark run $BENCH_RUN_ID (unexpected for a fresh run)"
            exit 1
          fi
          git commit -m "Persist package-mode benchmark results (benchmark run $BENCH_RUN_ID)"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

          # Regenerate the report explicitly: the GITHUB_TOKEN push above does
          # not trigger pages.yml's push trigger, but workflow_dispatch is the
          # documented exception GITHUB_TOKEN dispatches are allowed to run.
          # Last command of this step under set -e: only reached after a
          # successful commit AND push, and a failed dispatch fails the job.
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
